name: Supabase Keepalive

on:
  workflow_dispatch:
  schedule:
    # Dagelijks om 08:00 UTC om Free-tier-pauzering bij lage activiteit te voorkomen.
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_KEEPALIVE_SECRET: ${{ secrets.SUPABASE_KEEPALIVE_SECRET }}

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ] || [ -z "${SUPABASE_KEEPALIVE_SECRET:-}" ]; then
            echo "::error::Missing SUPABASE_URL, SUPABASE_ANON_KEY or SUPABASE_KEEPALIVE_SECRET"
            exit 1
          fi
          echo "Configuration valid"

      - name: Run protected database keepalive
        run: |
          set -euo pipefail
          base_url="${SUPABASE_URL%/}"

          response=$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"p_secret\":\"${SUPABASE_KEEPALIVE_SECRET}\"}" \
            "${base_url}/rest/v1/rpc/github_keepalive")

          http_code=$(printf '%s\n' "$response" | tail -1)
          body=$(printf '%s\n' "$response" | sed '$d')

          case "$http_code" in
            2*) ;;
            *)
              echo "::error::Keepalive RPC failed (HTTP ${http_code}): ${body}"
              exit 1
              ;;
          esac

          if ! printf '%s' "$body" | grep -q '"ok":true'; then
            echo "::error::Keepalive RPC returned an unexpected response"
            exit 1
          fi

          echo "Keepalive RPC OK (HTTP ${http_code}) — no business tables were read"
