name: Recovered source guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and verify recovered source
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npm run build
      - name: TypeScript check
        run: npx tsc -b --pretty false
      - name: Lint maintained source
        run: npm run lint
      - name: Dependency security audit
        run: npm run verify:security
